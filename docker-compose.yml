
version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - craftcommand-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
      - backend-servers:/app/minecraft_servers
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
    restart: unless-stopped
    networks:
      - craftcommand-network

volumes:
  backend-data:
  backend-servers:

networks:
  craftcommand-network:
    driver: bridge
